<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guitar Mentor — UX-01 prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf0ee;color:#243d37;font:16px/1.55 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button,a,summary,input,textarea,select{outline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #28776d}button{border:1px solid #b8c9c3;border-radius:9px;background:#fff;padding:10px 16px;color:inherit;min-height:44px}.primary{background:#28776d;border-color:#28776d;color:white}.quiet{border-color:transparent;background:transparent;text-decoration:underline}a{color:#21695f}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4cqw,42px);line-height:1.18;letter-spacing:-1px;margin-bottom:16px}h2{font-size:23px;line-height:1.3}h3{font-size:18px}small,.muted{color:#5b7069}.review{max-width:1200px;margin:auto;padding:20px 24px;display:flex;gap:16px;align-items:end;flex-wrap:wrap}.review label{font-size:13px;display:grid;gap:4px}.review select{max-width:100%;padding:8px;border:1px solid #b8c9c3;border-radius:6px;background:white}.review p{margin:0;flex:1 1 260px;font-size:13px}.frame{max-width:1200px;margin:0 auto 36px;background:#f8faf8;box-shadow:0 12px 40px #243d3712;container-type:inline-size;overflow:clip}.frame.mobile{max-width:360px}.app-header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dce5df;padding:18px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand{border:0;padding:0;display:flex;align-items:center;gap:10px;background:transparent;font-weight:700;text-align:left}.brand span{display:grid;place-items:center;border-radius:12px;width:40px;height:40px;background:#e1efea;color:#28776d;font-size:21px}.app-header nav{display:flex;gap:8px;margin-right:auto}.app-header nav button{border:0;background:none;padding:8px}.app-header nav button[aria-current]{color:#21695f;text-decoration:underline;text-underline-offset:8px}.header-user{font-size:13px}.tools{display:flex;gap:4px}.tools button{padding:8px 12px}.main{padding:36px 40px 48px;max-width:1140px;margin:auto;min-width:0}.eyebrow{color:#397a6c;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:600;margin-bottom:12px}.lead{max-width:640px;color:#526c62}.hero{padding:26px 0 34px;max-width:780px}.resume{background:#e8f2ed;border:1px solid #d5e5dc;border-radius:16px;padding:28px;max-width:760px}.resume h2{margin-bottom:8px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.row.spread{justify-content:space-between}.meta{font-size:14px;color:#5b7069;display:flex;gap:8px 20px;flex-wrap:wrap;margin-bottom:20px}.work-grid{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:28px;align-items:start}.surface{background:white;border:1px solid #dce5df;border-radius:14px;padding:26px;min-width:0}.surface+.surface{margin-top:20px}.section-number{color:#709287;margin-right:8px}.surface h2{margin-bottom:18px}.surface h3{margin:20px 0 10px}.surface p:last-child{margin-bottom:0}.notice{padding:14px 16px;background:#edf2ef;border-left:3px solid #8aa69a;border-radius:4px;margin:16px 0}.notice.error{background:#fff2ec;border-color:#c66e4b;color:#703c26}.status{font-size:14px;padding:5px 10px;border-radius:5px;background:#e8f2ed;display:inline-block;margin-bottom:16px}.state-note{font-size:14px;color:#5b7069;margin:0 0 24px}.stack{display:grid;gap:12px}.stack label{display:grid;gap:6px}input,textarea{width:100%;padding:10px;border:1px solid #b8c9c3;border-radius:8px;background:white;color:inherit}textarea{resize:vertical}.recording{height:56px;display:flex;align-items:center;gap:5px;margin:12px 0}.recording i{width:4px;background:#28776d;border-radius:3px;height:24px}.recording i:nth-child(3n){height:42px}.recording i:nth-child(3n+1){height:14px}.file{padding:14px;border:1px solid #dce5df;border-radius:8px;overflow-wrap:anywhere}.history{margin-top:22px;border-top:1px solid #e1e8e2;padding-top:16px}details{margin-top:16px}summary{cursor:pointer;min-height:44px;display:list-item;padding:8px 0;color:#286d5f}details p{margin:8px 0}.score{border:1px solid #dce5df;padding:24px 16px;text-align:center;background:#fbfcfa}.score-lines{height:66px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 10px,#9cab9e 10px,#9cab9e 11px);margin:16px 0}.divider{border:0;border-top:1px solid #dce5df;margin:24px 0}.footer{font-size:12px;color:#6a7e75;padding:16px 28px;border-top:1px solid #dce5df}.profile-form{max-width:600px}.profile-form label{margin-bottom:16px}.screen-message{max-width:680px;padding:32px 0}.screen-message h1{font-size:32px}.secondary-links{margin-top:28px;display:flex;flex-wrap:wrap;gap:20px}dialog{border:1px solid #c4d5cb;border-radius:16px;max-width:min(500px,90vw);padding:28px;color:#243d37}dialog::backdrop{background:#1b372d66}.result-copy{font-size:15px}#announcement{margin-top:14px;min-height:24px;color:#21695f}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@container(max-width:680px){.app-header{padding:14px 16px;gap:8px}.brand{margin-right:auto}.brand strong{font-size:14px}.header-user{display:none}.app-header nav{order:3;width:100%}.tools button{font-size:12px;padding:8px}.main{padding:24px 16px 32px}.work-grid{grid-template-columns:1fr;gap:20px}.surface{padding:20px}.hero{padding:12px 0 22px}.resume{padding:20px}.row>button{max-width:100%}.footer{padding:14px 16px}.meta{gap:5px 14px}.row.stretch>button{flex:1 1 150px}h1{font-size:29px}.lead{font-size:15px}}
@media(max-width:500px){.review{padding:16px}.review label{width:100%}.frame{margin-bottom:0}.review select{width:100%}}
</style></head><body>
<aside class="review" aria-label="Управление прототипом"><p><strong>UX-01 · Прототип для согласования</strong><br>Демонстрационные данные. Без микрофона, файлов, API и сохранения решений.</p><label>Сценарий<select id="scenario"><option value="home">Главная · есть занятие</option><option value="new">Первый вход</option><option value="profile">Профиль</option><option value="onboarding">Опыт и цели</option><option value="diagnosis">Начать диагностику</option><option value="intake">Диагностика · материалы</option><option value="catalog">Выбор упражнения</option><option value="lesson">Занятие · без попыток</option><option value="draft">Запись готова</option><option value="uploading">Отправка</option><option value="processing">Обработка</option><option value="noassessment">Нет музыкальной оценки</option><option value="assessed">Пример реальной оценки</option><option value="terminal">Работа завершена учеником</option><option value="error">Ошибка отправки</option><option value="resumeError">Ошибка восстановления</option><option value="loading">Загрузка</option><option value="empty">Каталог пуст</option></select></label><label>Экран<select id="device"><option value="desktop">Компьютер</option><option value="mobile">Телефон · 360 px</option></select></label><label>Язык<select id="locale"><option value="ru">RU</option><option value="en">EN</option></select></label></aside>
<div id="prototype" class="frame"><header class="app-header"><button class="brand" data-action="home" aria-label="Guitar Mentor — главная"><span aria-hidden="true">♪</span><strong>Guitar Mentor AI</strong></button><nav aria-label="Навигация"><button data-action="home" id="nav-home">Главная</button><button data-action="lesson" id="nav-lesson">Занятие</button><button data-action="profile" id="nav-profile">Профиль</button></nav><span class="header-user">Ученик</span><div class="tools"><button data-action="tool" id="tuner">Тюнер</button><button data-action="tool" id="metronome">Метроном</button></div></header><main class="main" id="content"></main><footer class="footer" id="footer">Акустическая гитара · Fingerstyle</footer></div>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="row"><button id="confirm-cancel"></button><button id="confirm-ok" class="primary"></button></div></dialog>
<script>
(()=>{'use strict';const app=document.getElementById('prototype'),content=document.getElementById('content'),scenario=document.getElementById('scenario'),locale=document.getElementById('locale'),dialog=document.getElementById('confirm');let state='home',recording=false,draftText='',setupStep=1;const en=()=>locale.value==='en',t=(ru,eng)=>en()?eng:ru;const button=(label,action,primary=false)=>`<button type="button" class="${primary?'primary':''}" data-action="${action}">${label}</button>`;const title=()=>t('Вечерний блюз в ми','Evening blues in E');const metadata=()=>`<div class="meta"><span>GM-EB01 · v0.8B</span><span>84 BPM · 4/4</span><span>${t('12 тактов','12 bars')}</span><span>CC BY 4.0</span></div>`;const header=(label)=>`<p class="eyebrow">${label}</p>`;const note=(text,error=false)=>`<div class="notice ${error?'error':''}" ${error?'role="alert"':'role="status"'}>${text}</div>`;const announcement=()=>'<p id="announcement" role="status" aria-live="polite"></p>';
function home(isNew=false){return `${header(t('Ваше пространство для музыки','Your space for music'))}<div class="hero"><h1>${isNew?t('Начнём с вашей гитары','Let’s start with your guitar'):t('Продолжим занятие?','Ready to play?')}</h1><p class="lead">${isNew?t('Сохраните профиль и расскажите, что уже умеете. Запись для первого знакомства необязательна.','Create your profile and tell us what you already play. A recording is optional.'):t('Материалы, запись и результат — в одном месте. Можно вернуться к работе в удобном темпе.','Your materials, recording and result, together. Return at your own pace.')}</p></div>${isNew?button(t('Создать профиль','Create profile'),'profile',true):`<section class="resume" aria-label="${t('Текущее занятие','Current lesson')}"><p class="eyebrow">${t('Текущее занятие','Current lesson')}</p><h2>${title()}</h2>${metadata()}<p>${t('Вы ещё не отправляли исполнение этого упражнения.','You haven’t submitted this exercise yet.')}</p>${button(t('Продолжить занятие','Continue lesson'),'lesson',true)}</section>`}<div class="secondary-links">${button(t('Опыт и цели','Experience and goals'),'onboarding')}</div>`;}
function setup(){const profile=state==='profile';return `${header(t('Настройка обучения','Learning setup'))}<h1>${profile?t('Ваш профиль','Your profile'):t('Опыт и цели','Experience and goals')}</h1><p class="lead">${profile?t('Сохранение остаётся отдельным действием.','Saving remains an explicit action.'):t('Можно начать с нуля. Известные произведения необязательны.','Starting from zero is fine. Known pieces are optional.')}</p>${!profile?`<p class="muted">${t('Шаг','Step')} ${setupStep} ${t('из 2','of 2')}</p>`:''}<form id="setup" class="stack profile-form"><label>${profile?t('Имя','Name'):t('Уровень','Experience')}<input required value="${profile?t('Ученик','Student'):t('Начинающий','Beginner')}" aria-label="${profile?t('Имя','Name'):t('Уровень','Experience')}"></label><label>${profile?t('Музыкальные предпочтения','Music preferences'):t('Цели','Goals')}<textarea rows="2">${profile?t('Блюз, рок, классика','Blues, rock, classical'):t('Мелодический fingerstyle','Melodic fingerstyle')}</textarea></label><div class="row">${button(!profile&&setupStep===1?t('Далее','Next'):t('Сохранить','Save'),!profile&&setupStep===1?'setupNext':'save',true)}</div>${announcement()}<div id="setup-next" hidden>${button(profile?t('Перейти к опыту и целям','Experience and goals'):t('Перейти к диагностике','Start diagnosis'),profile?'onboarding':'diagnosis')}</div></form>`;}
function intake(){return `${header(t('Первое знакомство','Getting started'))}<h1>${t('Что вы уже играете?','What do you already play?')}</h1><p class="lead">${t('Можно приложить знакомую запись и ноты или сразу перейти к упражнению.','Add a known performance and score, or go straight to an exercise.')}</p><section class="surface"><h2>${t('Материалы от вас','Your materials')}</h2><p>${t('Запись и ноты необязательны. В этом прототипе используются только демонстрационные материалы.','Recordings and scores are optional. This prototype only uses demonstration materials.')}</p><div class="row">${button(t('Добавить пример','Add an example'),'sample')}${button(t('Продолжить без записи','Continue without a recording'),'catalog',true)}</div>${announcement()}</section>`;}
function catalog(){return `${header(t('Выбор упражнения','Choose an exercise'))}<h1>${t('С чего начнём','Where to begin')}</h1><p class="lead">${t('Посмотрите материалы до назначения. Просмотр ничего не назначает.','Preview the materials before assigning. Previewing does not assign a task.')}</p><article class="surface"><h2>${title()}</h2>${metadata()}<p>${t('12-тактовый блюз E7–A7–B7: бас большим пальцем, мелодия и аккордовые ответы.','A twelve-bar E7–A7–B7 blues: thumb bass, melody and chord responses.')}</p><details><summary>${t('Материалы и сведения','Materials and information')}</summary><p>${t('PDF и MP3 появятся здесь при наличии. MusicXML остаётся альтернативой.','PDF and MP3 appear here when available. MusicXML remains an alternative.')}</p><p>Guitar Mentor AI · CC BY 4.0 · v0.8B</p></details><div class="row">${button(t('Назначить упражнение','Assign exercise'),'lesson',true)}</div></article>`;}
function materials(){return `<section class="surface"><h2><span class="section-number">01</span>${t('Материалы','Materials')}</h2><p>${t('12-тактовый блюз E7–A7–B7: бас большим пальцем, мелодия и аккордовые ответы.','Twelve-bar E7–A7–B7 blues: thumb bass, melody and chord responses.')}</p><details><summary>${t('Учебные ориентиры','Practice criteria')}</summary><ul><li>${t('Равномерное ощущение долей без произвольных остановок','A steady pulse without unintended stops')}</li><li>${t('Басовая линия не прерывается на смене мелодических фраз','Continuous bass across melodic phrases')}</li><li>${t('Мелодическая линия слышна поверх баса','Melody audible above the bass')}</li></ul><p class="muted">${t('Это ориентиры упражнения, а не оценка вашего исполнения.','These are practice criteria, not an assessment of your performance.')}</p></details><div class="row">${button(t('Открыть метроном · 84 BPM','Open metronome · 84 BPM'),'tool')}</div><h3>${t('Аудиопример','Audio example')}</h3><p class="muted">${t('Аудиопример пока не установлен.','The audio example is not installed.')}</p><details><summary>${t('Ноты и табулатура','Score and tablature')}</summary><div class="score">${t('Предпросмотр отсутствующего PDF не показывается.','No preview is shown for an unavailable PDF.')}</div><p>${t('PDF пока не установлен. Доступен исходный MusicXML.','PDF is not installed. The MusicXML source remains available.')}</p>${button(t('MusicXML','MusicXML'),'source')}</details><details><summary>${t('Об упражнении','About this exercise')}</summary><p>GM-EB01 · v0.8B · Guitar Mentor AI · CC BY 4.0</p><p>${t('Рекомендуемая практика: 30 минут.','Recommended practice: 30 minutes.')}</p></details></section>`;}
function compose(){const draft=state==='draft'||state==='error';return `<section class="surface"><h2><span class="section-number">02</span>${t('Моя запись','My recording')}</h2>${state==='uploading'?note(t('Отправляем запись… Повторная отправка недоступна.','Submitting recording… Duplicate submission is unavailable.')):state==='terminal'?note(t('Работа завершена. Новая отправка для этого задания недоступна.','This task is complete. New submissions are unavailable.')):state==='processing'?`${note(t('Запись отправлена. Идёт техническая обработка.','Recording submitted. Technical processing is in progress.'))}<p>${t('Страница обновит статус автоматически. Музыкальная оценка — отдельный результат.','The status updates automatically. Musical assessment is a separate result.')}</p>`:`${draft?`<div class="file"><strong>practice.webm</strong><p class="muted">${t('Демонстрационный черновик · ещё не отправлен','Demo draft · not submitted')}</p>${button(t('Прослушать','Listen'),'listen')}${button(t('Заменить запись','Replace recording'),'replace')}</div>`:recording?`<div class="recording" aria-label="${t('Идёт запись','Recording')}" role="status">${'<i></i>'.repeat(22)}</div><p>${t('Идёт запись…','Recording…')}</p>${button(t('Остановить запись','Stop recording'),'stop',true)}`:`<p>${t('Запишите исполнение здесь или выберите аудиофайл.','Record your performance here or choose an audio file.')}</p><div class="row stretch">${button(t('Записать исполнение','Record performance'),'record',true)}${button(t('Выбрать файл','Choose file'),'file')}</div>`}<div class="stack" style="margin-top:18px"><label>${t('Комментарий — необязательно','Comment — optional')}<textarea id="draft-comment" maxlength="2000" rows="2" placeholder="${t('Что получилось, над чем ещё работаете','What went well; what you are still practising')}"></textarea></label></div>${state==='error'?note(t('Не удалось отправить запись. Черновик сохранён. Можно повторить отправку.','Could not submit. Your draft is retained. You can retry.'),true):''}<div class="row" style="margin-top:16px">${draft?button(t(state==='error'?'Повторить отправку':'Отправить запись',state==='error'?'Retry submission':'Submit recording'),'send',true):''}</div>`}${announcement()}</section>`;}
function results(){let text=t('После отправки здесь появится статус и доступный результат.','After submission, the status and available result appear here.');if(state==='processing')text=t('Техническая обработка ещё не завершена.','Technical processing is not complete.');if(state==='noassessment')text=t('Запись обработана. Музыкальная оценка пока недоступна — навык не подтверждён.','The recording was processed. Musical assessment is unavailable; no skill is confirmed.');if(state==='assessed')text=t('По доступной оценке рекомендуется доработка. Решение о завершении остаётся за вами.','The available assessment recommends more practice. You can choose to complete the task.');if(state==='terminal')text=t('Работа завершена по вашему решению. Это не подтверждает навык автоматически.','Completed by your choice. This does not automatically confirm a skill.');return `<section class="surface"><h2><span class="section-number">03</span>${t('Результат','Result')}</h2><p class="result-copy" role="status">${text}</p>${['noassessment','assessed'].includes(state)?`<p class="muted">${t('Попытка №1','Attempt #1')}</p>${state==='assessed'?`<details><summary>${t('Критерии и основания оценки','Assessment criteria and evidence')}</summary><p>${t('Только пример представления реальной оценки. В прототипе не выполняется анализ и не подтверждаются навыки.','Example presentation of a real assessment only. The prototype performs no analysis and confirms no skills.')}</p><p>${t('Источник, метод и версия показываются из ответа API.','Source, method and version come from the API response.')}</p></details>`:''}<div class="row stretch">${button(t('Продолжить практику','Keep practising'),'practise',true)}${button(t('Завершить работу','Complete task'),'complete')}</div>`:''}${state==='uploading'?note(t('Отправляем запись… Повторная отправка недоступна.','Submitting recording… Duplicate submission is unavailable.')):state==='terminal'?note(t('Следующее задание пока не формируется автоматически. Материалы и история доступны для просмотра.','The next task is not generated automatically. Materials and history remain readable.')):''}<details class="history"><summary>${t('История попыток и решений','Attempt and decision history')}</summary><p>${['lesson','draft','error'].includes(state)?t('Отправленных попыток пока нет.','No submissions yet.'):t('Попытка №1 · история сохраняется.','Attempt #1 · history is retained.')}</p>${state==='terminal'?`<p>${t('Решение: завершить по своему выбору. Исходная оценка не изменена.','Decision: complete by learner choice. The original assessment is unchanged.')}</p>`:''}</details></section>`;}
function render(focus=false){scenario.value=state;recording=state==='recording';if(recording)scenario.value='lesson';document.documentElement.lang=en()?'en':'ru';document.getElementById('nav-home').textContent=t('Главная','Home');document.getElementById('nav-lesson').textContent=t('Занятие','Lesson');document.getElementById('nav-profile').textContent=t('Профиль','Profile');document.getElementById('tuner').textContent=t('Тюнер','Tuner');document.getElementById('metronome').textContent=t('Метроном','Metronome');document.querySelector('.header-user').textContent=t('Ученик','Student');document.getElementById('footer').textContent=t('Акустическая гитара · Fingerstyle','Acoustic guitar · Fingerstyle');document.querySelectorAll('nav button').forEach(b=>b.removeAttribute('aria-current'));document.getElementById(state==='home'||state==='new'?'nav-home':state==='profile'?'nav-profile':'nav-lesson').setAttribute('aria-current','page');let html='';if(state==='home'||state==='new')html=home(state==='new');else if(state==='profile'||state==='onboarding')html=setup();else if(state==='diagnosis')html=`${header(t('Первичная диагностика','Initial diagnosis'))}<h1>${t('Познакомимся с вашей игрой','Let’s get to know your playing')}</h1><p class="lead">${t('Знакомая запись необязательна. Можно начать с упражнения.','A known recording is optional. You can start with an exercise.')}</p>${button(t('Начать диагностику','Start diagnosis'),'intake',true)}`;else if(state==='intake')html=intake();else if(state==='catalog')html=catalog();else if(state==='loading')html=`<div class="screen-message"><h1>${t('Открываем занятие','Opening your lesson')}</h1><p role="status">${t('Проверяем сохранённые данные…','Checking saved information…')}</p></div>`;else if(state==='resumeError')html=`<div class="screen-message"><h1>${t('Не удалось открыть занятие','Could not open your lesson')}</h1>${note(t('Сохранённый контекст не удалён. Проверьте соединение и повторите.','Your saved context is retained. Check your connection and retry.'),true)}${button(t('Повторить','Retry'),'home',true)}</div>`;else if(state==='empty')html=`<div class="screen-message"><h1>${t('Пока нет доступного упражнения','No exercise is available yet')}</h1><p>${t('Не будем назначать неподходящее или выдуманное задание. Можно проверить выбор позже.','No unsuitable or invented task will be assigned. You can check again later.')}</p>${button(t('Обновить список','Refresh list'),'catalog',true)}</div>`;else html=`${header(t('Ваше занятие','Your lesson'))}<div class="row spread"><h1>${title()}</h1><span class="status">${t(state==='terminal'?'Работа завершена':'В работе',state==='terminal'?'Task completed':'In progress')}</span></div>${metadata()}<div class="work-grid"><div>${materials()}</div><div>${compose()}${results()}</div></div>`;content.innerHTML=html;const draft=content.querySelector('#draft-comment');if(draft){draft.value=draftText;draft.addEventListener('input',()=>{draftText=draft.value;});}if(focus){const h=content.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}}
function go(next){state=next;setupStep=1;render(true);}function say(text){const el=content.querySelector('#announcement');if(el)el.textContent=text;}function askComplete(){document.getElementById('confirm-title').textContent=t('Завершить работу над заданием?','Complete this task?');document.getElementById('confirm-copy').textContent=t('Замечания и история сохранятся. Навык не станет подтверждённым только из-за вашего решения.','Feedback and history are retained. Your choice alone does not confirm a skill.');document.getElementById('confirm-cancel').textContent=t('Отмена','Cancel');document.getElementById('confirm-ok').textContent=t('Завершить работу','Complete task');dialog.showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='setupNext'){setupStep=2;render(true);}else if(a==='save'){if(!document.getElementById('setup').reportValidity())return;say(t('Сохранено в демонстрационном сценарии.','Saved in this demonstration.'));document.getElementById('setup-next').hidden=false;}else if(a==='sample')say(t('Пример добавлен. Отправка реальных файлов не выполняется.','Example added. No actual file was uploaded.'));else if(a==='record')go('recording');else if(['stop','file','replace'].includes(a))go('draft');else if(a==='send'){draftText='';go('processing');}else if(a==='listen')say(t('Предпросмотр обозначен; в прототипе нет аудиофайла.','Preview placeholder; this prototype contains no audio file.'));else if(a==='source')say(t('В приложении откроется URL MusicXML точной версии.','The app will open the exact-version MusicXML URL.'));else if(a==='tool'){document.getElementById('confirm-title').textContent=t('Существующий инструмент','Existing tool');document.getElementById('confirm-copy').textContent=t('Метроном и тюнер сохраняют принятый интерфейс. Здесь проверяется только их место в сценарии.','Metronome and tuner retain their approved UI. This prototype only demonstrates their placement.');document.getElementById('confirm-cancel').textContent=t('Закрыть','Close');document.getElementById('confirm-ok').textContent=t('Вернуться к занятию','Return to lesson');dialog.showModal();dialog.dataset.tool='yes';}else if(a==='complete')askComplete();else if(a==='practise'){draftText='';go('lesson');}else{if((draftText||['draft','error','recording'].includes(state))&&!confirm(t('Уйти и удалить неотправленный комментарий?','Leave and discard the unsent comment?')))return;draftText='';go(a);}});
document.getElementById('setup')?.addEventListener('submit',e=>e.preventDefault());document.addEventListener('submit',e=>e.preventDefault());document.getElementById('confirm-cancel').onclick=()=>dialog.close();document.getElementById('confirm-ok').onclick=()=>{if(dialog.dataset.tool){delete dialog.dataset.tool;dialog.close();return;}dialog.close();go('terminal');};dialog.addEventListener('close',()=>{delete dialog.dataset.tool;});scenario.addEventListener('change',()=>{draftText='';go(scenario.value);});locale.addEventListener('change',()=>render());document.getElementById('device').addEventListener('change',e=>app.classList.toggle('mobile',e.target.value==='mobile'));render();})();
</script></body></html>
