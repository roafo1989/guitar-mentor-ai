name: CATALOG-169 research prototype

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - research/169-guitarpro-converter
  workflow_dispatch:

concurrency:
  group: catalog-169-research
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic-gp3-gp4-gp5-gp7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
      - name: Install synthetic fixture generator
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/research/catalog-169/requirements.txt
      - name: Generate permitted independent GP3 GP4 GP5 fixtures
        run: python scripts/research/catalog-169/generate_fixtures.py
      - name: Verify fixture provenance hashes and known events
        run: node scripts/research/catalog-169/verify-fixtures.mjs
      - name: Install locked Node toolchain
        run: npm ci --prefix scripts/research/catalog-169 --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build isolated renderer image
        run: docker build -f scripts/research/catalog-169/Dockerfile -t gm169-research .
      - name: Run with hard network and resource limits
        shell: bash
        run: |
          mkdir -p artifacts/catalog-169
          chmod 777 artifacts/catalog-169
          { node --version; npm --version; python --version; python -m pip freeze; java -version 2>&1; } > artifacts/catalog-169/toolchain.txt
          name=gm169-$GITHUB_RUN_ID
          docker run --name "$name" --user 1000:1000 --network none --memory 512m --memory-swap 512m --cpus 1 --pids-limit 64 --read-only --tmpfs /tmp:rw,size=100m --mount "type=bind,src=$PWD/artifacts/catalog-169,dst=/out" gm169-research &
          pid=$!
          ( sleep 60; docker kill "$name" >/dev/null 2>&1 || true ) &
          watchdog=$!
          : > artifacts/catalog-169/container-samples.txt
          while kill -0 "$pid" 2>/dev/null; do
            docker stats --no-stream --format '{{.MemUsage}}|{{.CPUPerc}}' "$name" >> artifacts/catalog-169/container-samples.txt 2>/dev/null || true
            sleep 0.25
          done
          set +e
          wait "$pid"
          status=$?
          set -e
          kill "$watchdog" >/dev/null 2>&1 || true
          docker inspect "$name" --format 'exit={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} memoryBytes={{.HostConfig.Memory}} nanoCpus={{.HostConfig.NanoCpus}} network={{.HostConfig.NetworkMode}}' > artifacts/catalog-169/container-limits.txt
          docker rm "$name"
          exit "$status"
      - name: Upload compact research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-169-evidence
          path: artifacts/catalog-169
          if-no-files-found: warn
          retention-days: 14
