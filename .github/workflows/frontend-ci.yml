name: Vue frontend CI

on:
  push:
    branches:
      - main
      - "feature/dev-04-onboarding"
  pull_request:
    paths:
      - "frontend/**"
      # Guard Vue integration when backend APIs/storage change.
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Guard diagnostic intake navigation under recording and upload
        run: npm run test:intake
      - name: Metronome unit tests
        run: npm test
      - name: Tuner pitch and spectrum regression tests
        run: npm run test:tuner
      - name: Typecheck and build
        run: npm run build
