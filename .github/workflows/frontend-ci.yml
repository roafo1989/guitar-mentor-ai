name: Vue frontend CI

on:
  push:
    branches:
      - main
      - "feature/dev-04-onboarding"
  pull_request:
    paths:
      - "frontend/**"
      # Guard Vue integration when backend APIs/storage change.
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Guard diagnostic intake navigation under recording and upload
        run: npm run test:intake
      - name: Metronome unit tests
        run: npm test
      - name: Tuner pitch and spectrum regression tests
        run: npm run test:tuner
      - name: Typecheck and build
        run: npm run build
      - name: PDF.js provenance and dependency audit
        run: |
          npm view pdfjs-dist@5.4.394 dist.integrity
          npm audit --omit=dev --audit-level=high
      - name: Light Minimal opt-in typecheck and build
        run: npm run build
        env:
          VITE_GUITAR_MENTOR_LIGHT_MINIMAL: 'true'
      - name: Real Chrome isolated PDF score reader
        run: npm run test:score-browser
      - name: Real Chrome next-lesson picker smoke (mocked backend)
        run: npm run test:lesson-browser
      - name: Real Chrome keyboard and responsive UI smoke
        run: npm run test:browser
      - name: Real Chrome profile, onboarding and account UX regression
        run: npm run test:profile-browser
      - name: Upload profile UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa229-profile-ux
          path: docs/testing/qa229/*.png
          if-no-files-found: ignore
