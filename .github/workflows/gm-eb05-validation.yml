name: GM-EB05 notation validation
on:
  pull_request:
    paths:
      - 'music/etudes/GM-EB05/**'
      - 'scripts/validate_gm_eb05*.py'
      - '.github/workflows/gm-eb05-validation.yml'
  push:
    paths:
      - 'music/etudes/GM-EB05/**'
      - 'scripts/validate_gm_eb05*.py'
      - '.github/workflows/gm-eb05-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check original version
        run: python3 scripts/validate_gm_eb05.py
      - name: Check revised version 1.1 (score and tabs)
        run: python3 scripts/validate_gm_eb05_v11.py
