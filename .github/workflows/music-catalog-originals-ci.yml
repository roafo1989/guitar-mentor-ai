name: Private catalog originals browser
on:
  pull_request:
    paths:
      - 'backend/src/**/MusicCatalog*.java'
      - 'backend/src/main/resources/db/migration/V36__music_catalog_original_links.sql'
      - 'frontend/src/entities/music-archive/**'
      - 'frontend/src/i18n/*.json'
      - 'frontend/tests/music-archive-live-browser.mjs'
      - '.github/workflows/music-catalog-originals-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: catalog196
          POSTGRES_USER: catalog196
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U catalog196 -d catalog196"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser and locked frontend dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run real upload, attach, download and account isolation browser flow
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/catalog196
          SPRING_DATASOURCE_USERNAME: catalog196
          SPRING_DATASOURCE_PASSWORD: ci_only_password
          GUITAR_MENTOR_TEST_POSTGRES: 'true'
          GM_TEST_REAL_BROWSER: 'true'
        run: ./mvnw -B -ntp -Dtest=MusicCatalogOriginalBrowserPostgresTest test
      - name: Require executed browser evidence
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('backend/target/surefire-reports/TEST-ai.guitarmentor.infrastructure.security.MusicCatalogOriginalBrowserPostgresTest.xml')
          suite = ET.parse(report).getroot()
          assert int(suite.attrib['tests']) == 1
          assert int(suite.attrib['skipped']) == 0
          assert int(suite.attrib['failures']) == 0 and int(suite.attrib['errors']) == 0
          assert json.loads(Path('artifacts/catalog-196/browser/result.json').read_text())['status'] == 'PASS'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-196-browser
          path: |
            artifacts/catalog-196/browser
            backend/target/surefire-reports/*MusicCatalogOriginalBrowser*
          retention-days: 14
