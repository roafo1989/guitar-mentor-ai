name: Music catalog import checks
on:
  pull_request:
    paths:
      - 'scripts/music_catalog_import.py'
      - 'scripts/tests/test_music_catalog_import.py'
      - 'scripts/tests/test_music_catalog_postgres.py'
      - '.github/workflows/music-catalog-ci.yml'
      - 'backend/src/main/resources/db/migration/V27__private_music_catalog_index.sql'
  push:
    branches: [main]
    paths:
      - 'scripts/music_catalog_import.py'
      - 'scripts/tests/test_music_catalog_import.py'
      - 'scripts/tests/test_music_catalog_postgres.py'
      - '.github/workflows/music-catalog-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test offline validator
        run: |
          python -m py_compile scripts/music_catalog_import.py scripts/tests/test_music_catalog_postgres.py
          python -m unittest discover -s scripts/tests -p 'test_music_catalog_import.py' -v
  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: music_catalog_ci
          POSTGRES_USER: catalog_tester
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U catalog_tester -d music_catalog_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      MUSIC_CATALOG_DSN: postgresql://catalog_tester:ci_test_only@localhost:5432/music_catalog_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]'
      - name: Validate migration and transactional importer against disposable PostgreSQL
        run: python scripts/tests/test_music_catalog_postgres.py
