name: Java backend CI

on:
  push:
    branches:
      - main
      - "feature/dev-01-java-bootstrap"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/java-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guitar_mentor
          POSTGRES_USER: guitar_mentor_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guitar_mentor_app -d guitar_mentor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit tests, real PostgreSQL transaction integration and package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/guitar_mentor
          SPRING_DATASOURCE_USERNAME: guitar_mentor_app
          SPRING_DATASOURCE_PASSWORD: ci_only_password
          GUITAR_MENTOR_TEST_POSTGRES: 'true'
        run: ./mvnw --batch-mode verify
      - name: Ensure FFprobe is present for real audio-duration verification
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version
      - name: Launch app and verify PostgreSQL migration and HTTP
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/guitar_mentor
          SPRING_DATASOURCE_USERNAME: guitar_mentor_app
          SPRING_DATASOURCE_PASSWORD: ci_only_password
          GUITAR_MENTOR_ENABLE_UPLOADS: 'true'
          GUITAR_MENTOR_MEDIA_PATH: ./target/ci-attempts
        run: |
          set -euo pipefail
          ./mvnw --batch-mode spring-boot:run > boot.log 2>&1 &
          app_pid=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then echo "Smoke test failed (exit $result); last Spring Boot messages:"; tail -n 100 boot.log || true; fi; kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/system/ping | grep -q '"status":"ok"'; then
              health=$(curl --fail --silent --show-error http://localhost:8080/actuator/health)
              printf '%s' "$health" | grep -q '"status":"UP"'
              echo "Spring Boot and PostgreSQL Flyway bootstrap: OK"
              created=$(curl --fail --silent --show-error -X POST http://localhost:8080/api/v1/learners \
                -H 'Content-Type: application/json' \
                --data '{"displayName":"CI Student","instrumentCode":"ACOUSTIC_GUITAR","techniqueCode":"FINGERSTYLE","preferences":[{"styleCode":"FUNK","rating":"EXCLUDE"}]}')
              echo "$created" | grep -q '"rating":"EXCLUDE"'
              learner_id=$(printf '%s' "$created" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              curl --fail --silent --show-error "http://localhost:8080/api/v1/learners/$learner_id" | grep -q '"styleCode":"FUNK"'
              changed=$(curl --fail --silent --show-error -X PUT "http://localhost:8080/api/v1/learners/$learner_id/preferences" \
                -H 'Content-Type: application/json' \
                --data '{"instrumentCode":"ACOUSTIC_GUITAR","preferences":[{"styleCode":"BLUES","rating":"LIKE"}]}')
              echo "$changed" | grep -q '"styleCode":"BLUES"'
              if echo "$changed" | grep -q '"styleCode":"FUNK"'; then
                echo "Old preferences were not removed"
                exit 1
              fi
              echo "Learner profile REST smoke: OK"
              background=$(curl --fail --silent --show-error -X PUT \
                "http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/background" \
                -H 'Content-Type: application/json' \
                --data '{"experienceLevel":"BEGINNER","yearsPlaying":1,"skills":["CHORDS"],"knownPieces":[],"goals":["FINGERSTYLE"],"practiceMinutes":40,"sessionsPerWeek":3,"notes":""}')
              echo "$background" | grep -q '"experienceLevel":"BEGINNER"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/background" \
                | grep -q '"sessionsPerWeek":3'
              echo "Onboarding REST smoke: OK"
              started=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions" \
                -H 'Content-Type: application/json' --data '{"instrumentCode":"ACOUSTIC_GUITAR"}')
              echo "$started" | grep -q '"status":"COLLECTING_EVIDENCE"'
              session_id=$(printf '%s' "$started" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              continued=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/continue")
              echo "$continued" | grep -q '"status":"READY_FOR_TASK"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id" \
                | grep -q '"status":"READY_FOR_TASK"'
              restarted=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions" \
                -H 'Content-Type: application/json' --data '{"instrumentCode":"ACOUSTIC_GUITAR"}')
              echo "$restarted" | grep -q "\"id\":\"$session_id\""
              echo "Diagnostic session HTTP smoke: OK"
              # FT-002-02: real HTTP against PostgreSQL, including ownership and read-only GET.
              rec_base="http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/exercise-recommendations"
              novice=$(curl --fail --silent --show-error "$rec_base")
              printf '%s' "$novice" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["status"]=="NO_MATCH" and a["reasonCode"]=="NO_BEGINNER_EXERCISE" and not a["items"]'
              curl --silent --output /dev/null --write-out '%{http_code}' "$rec_base?limit=4" | grep -qx 400
              other=11111111-1111-4111-8111-111111111111
              curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080/api/v1/learners/$other/diagnostic-sessions/$session_id/exercise-recommendations" | grep -qx 404
              skill_base="http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/skills"
              snapshot=$(curl --fail --silent --show-error "$skill_base")
              printf '%s' "$snapshot" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==9 and all(x["assessedLevel"]==0 for x in a)'
              for retry in 1 2; do
                curl --fail --silent --show-error -X PUT                   "http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/background"                   -H 'Content-Type: application/json'                   --data '{"experienceLevel":"BEGINNER","yearsPlaying":1,"skills":["CHORDS","FINGERSTYLE_MELODY"],"knownPieces":[],"goals":["FINGERSTYLE"],"practiceMinutes":40,"sessionsPerWeek":3,"notes":""}' > /dev/null
              done
              claimed_history=$(curl --fail --silent --show-error "$skill_base/history?skillCode=MELODY")
              printf '%s' "$claimed_history" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==1 and a[0]["claimState"]=="CLAIMED" and a[0]["level"] is None and a[0]["confidence"] is None'
              curl --fail --silent --show-error -X PUT                 "http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/background"                 -H 'Content-Type: application/json'                 --data '{"experienceLevel":"INTERMEDIATE","yearsPlaying":2,"skills":["CHORDS"],"knownPieces":[],"goals":["RHYTHM"],"practiceMinutes":40,"sessionsPerWeek":3,"notes":""}' > /dev/null
              withdrawn=$(curl --fail --silent --show-error "$skill_base/history?skillCode=MELODY")
              printf '%s' "$withdrawn" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==2 and a[0]["claimState"]=="RETRACTED" and a[1]["claimState"]=="CLAIMED"'
              recommended=$(curl --fail --silent --show-error "$rec_base")
              printf '%s' "$recommended" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["status"]=="RECOMMENDED" and a["items"][0]["exerciseCode"]=="GM-EB01" and "UNKNOWN_SKILL_DIAGNOSTIC" in a["items"][0]["reasonCodes"]'
              curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" | grep -qx 204
              echo "Skill claims and recommendation HTTP integration: OK"
              catalog=$(curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/exercises?instrumentCode=ACOUSTIC_GUITAR&techniqueCode=FINGERSTYLE")
              echo "$catalog" | grep -q '"code":"GM-EB01"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/exercises/GM-EB01/score" -o exercise.musicxml
              grep -q 'score-partwise' exercise.musicxml
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/exercises/GM-EB01/events" -o exercise-events.json
              grep -q '"measures"' exercise-events.json
              assigned=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" \
                -H 'Content-Type: application/json' --data '{"exerciseCode":"GM-EB01"}')
              echo "$assigned" | grep -q '"code":"GM-EB01"'
              # #119 QA: actual HTTP shape of catalog, detail, POST assignment and GET assignment.
              detail=$(curl --fail --silent --show-error "http://localhost:8080/api/v1/exercises/GM-EB01")
              current_task=$(curl --fail --silent --show-error                 "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks")
              printf '%s' "$catalog" > qa119-catalog.json
              printf '%s' "$detail" > qa119-detail.json
              printf '%s' "$assigned" > qa119-assigned.json
              printf '%s' "$current_task" > qa119-current.json
              python3 - <<'PY'
          import json
          criteria = [
              "Равномерное ощущение долей без произвольных остановок",
              "Басовая линия не прерывается на смене мелодических фраз",
              "Мелодическая линия слышна поверх баса",
          ]
          catalog = json.load(open("qa119-catalog.json"))
          detail = json.load(open("qa119-detail.json"))
          assigned = json.load(open("qa119-assigned.json"))["exercise"]
          current = json.load(open("qa119-current.json"))["exercise"]
          assert len(catalog) == 1, catalog
          for exercise in (catalog[0], detail, assigned, current):
              assert exercise["code"] == "GM-EB01" and exercise["version"] == "0.8B"
              assert exercise["learningGoal"] is None
              assert exercise["practiceInstructions"] is None
              assert exercise["tuning"] is None
              assert exercise["successCriteria"] == criteria
              assert exercise["recommendedPracticeMinutes"] == 30
              assert exercise["scoreUrl"] == "/api/v1/exercises/GM-EB01/score"
          assert catalog[0] == detail == assigned == current
          print("QA #119 HTTP catalog/detail/assigned/retrieved DTO contract: OK")
          PY
              task_id=$(printf '%s' "$assigned" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              repeat=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" \
                -H 'Content-Type: application/json' --data '{"exerciseCode":"GM-EB01"}')
              echo "$repeat" | grep -q "\"id\":\"$task_id\""
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id" \
                | grep -q '"status":"TASK_ASSIGNED"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" \
                | grep -q '"code":"GM-EB01"'
              conflict_code=$(curl --silent --output diagnostic-recommendation-error.json --write-out '%{http_code}' "$rec_base")
              test "$conflict_code" = '409'
              python3 -c 'import json; a=json.load(open("diagnostic-recommendation-error.json")); assert a["code"]=="TASK_ALREADY_ASSIGNED"'
              echo "Recommendation already-assigned HTTP conflict: OK"
              echo "Exercise catalog and diagnostic assignment HTTP smoke: OK"
              attempts_base="http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks/$task_id/attempts"
              capability=$(curl --fail --silent --show-error "$attempts_base/capabilities")
              echo "$capability" | grep -q '"enabled":true'
              initial=$(curl --fail --silent --show-error "$attempts_base")
              test "$initial" = '[]'
              python3 -c 'import wave; f=wave.open("sample.wav", "wb"); f.setnchannels(1); f.setsampwidth(2); f.setframerate(8000); f.writeframes(bytes(1600)); f.close()'
              submission_id=123e4567-e89b-12d3-a456-426614174000
              attempt=$(curl --fail --silent --show-error -X POST "$attempts_base" \
                -F "file=@sample.wav;type=audio/wav" -F "comment=CI test" \
                -F "requestId=$submission_id")
              printf '%s' "$attempt" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["status"] in ("UPLOADED","PROCESSING","PROCESSED")'
              echo "$attempt" | grep -q '"number":1'
              attempt_id=$(printf '%s' "$attempt" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              duplicate=$(curl --fail --silent --show-error -X POST "$attempts_base" \
                -F "file=@sample.wav;type=audio/wav" -F "requestId=$submission_id")
              echo "$duplicate" | grep -q "\"id\":\"$attempt_id\""
              history=$(curl --fail --silent --show-error "$attempts_base")
              printf '%s' "$history" | python3 -c \
                'import json,sys; a=json.load(sys.stdin); assert len(a)==1 and a[0]["number"]==1'
              # Await the local background technical worker, without confusing it with music assessment.
              validated=false
              for check in $(seq 1 30); do
                latest=$(curl --fail --silent --show-error "$attempts_base")
                if printf '%s' "$latest" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==1 and a[0]["status"]=="PROCESSED" and a[0]["assessmentAvailable"] is False and a[0]["processingFinishedAt"] and not a[0]["processingErrorCode"]'; then
                  validated=true
                  break
                fi
                sleep 1
              done
              test "$validated" = true
              echo "Asynchronous file integrity verification: OK"
              printf '%s' "$latest" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert abs(a[0]["audioDurationSeconds"]-0.1) < 0.02'
              # A valid 125-second WAV stays below the 20-MiB limit,
              # but must fail the server-side duration check.
              python3 -c 'import wave; f=wave.open("too-long.wav", "wb"); f.setnchannels(1); f.setsampwidth(2); f.setframerate(8000); f.writeframes(bytes(125*8000*2)); f.close()'
              long_upload=$(curl --fail --silent --show-error -X POST "$attempts_base" \
                -F "file=@too-long.wav;type=audio/wav" \
                -F "requestId=123e4567-e89b-12d3-a456-426614174002")
              echo "$long_upload" | grep -q '"number":2'
              rejected_long=false
              for check in $(seq 1 30); do
                latest_long=$(curl --fail --silent --show-error "$attempts_base")
                if printf '%s' "$latest_long" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==2 and a[0]["status"]=="FAILED" and a[0]["processingErrorCode"]=="DURATION_EXCEEDED" and a[1]["status"]=="PROCESSED"'; then
                  rejected_long=true
                  break
                fi
                sleep 1
              done
              test "$rejected_long" = true
              echo "Overlong audio and previous attempt history: OK"
              printf '%s' 'not an mp3' >invalid.mp3
              bad_status=$(curl --silent --output invalid-response.json --write-out '%{http_code}' \
                -X POST "$attempts_base" -F "file=@invalid.mp3;type=audio/mpeg" \
                -F "requestId=123e4567-e89b-12d3-a456-426614174001")
              test "$bad_status" = '400'
              python3 -c 'import json; p=json.load(open("invalid-response.json")); assert p["code"]=="INVALID_AUDIO_CONTENT"'
              after_rejection=$(curl --fail --silent --show-error "$attempts_base")
              printf '%s' "$after_rejection" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==2 and a[0]["number"]==2 and a[1]["number"]==1'
              echo "Attempt upload, idempotency, structured rejection and unchanged history HTTP smoke: OK"
              # Compatibility regression for all accepted formats, using real encoded audio.
              # Only the single AttemptMediaStore adapter should handle these uploads.
              for format in mp3 ogg webm; do
                case "$format" in
                  mp3) codec=libmp3lame; request_id=123e4567-e89b-12d3-a456-426614174003 ;;
                  ogg) codec=libvorbis;  request_id=123e4567-e89b-12d3-a456-426614174004 ;;
                  webm) codec=libopus;   request_id=123e4567-e89b-12d3-a456-426614174005 ;;
                esac
                ffmpeg -nostdin -hide_banner -loglevel error \
                  -f lavfi -i anullsrc=channel_layout=mono:sample_rate=48000 \
                  -t 0.5 -c:a "$codec" -y "test.$format"
                uploaded=$(curl --fail --silent --show-error -X POST "$attempts_base" \
                  -F "file=@test.$format;type=audio/$format" -F "requestId=$request_id")
                printf '%s' "$uploaded" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["format"] == sys.argv[1]' "$format"
                processed=false
                for check in $(seq 1 30); do
                  latest_format=$(curl --fail --silent --show-error "$attempts_base")
                  if printf '%s' "$latest_format" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a[0]["format"]==sys.argv[1] and a[0]["status"]=="PROCESSED" and a[0]["assessmentAvailable"] is False' "$format"; then
                    processed=true
                    break
                  fi
                  sleep 1
                done
                test "$processed" = true
                echo "Format $format upload and technical worker: OK"
              done
              # #94: both ordinary M4A and 3gp4-branded smartphone-dictaphone M4A.
              capability=$(curl --fail --silent --show-error "$attempts_base/capabilities")
              printf '%s' "$capability" | python3 -c 'import json,sys; assert "m4a" in json.load(sys.stdin)["formats"]'
              for brand in 3gp4 default; do
                if [ "$brand" = 3gp4 ]; then
                  brand_opt='-brand 3gp4'
                  m4a_id=123e4567-e89b-12d3-a456-426614174006
                else
                  brand_opt=''
                  m4a_id=123e4567-e89b-12d3-a456-426614174007
                fi
                # Shell splitting is intentional here: -brand is either an option pair or empty.
                ffmpeg -nostdin -hide_banner -loglevel error \
                  -f lavfi -i anullsrc=channel_layout=mono:sample_rate=44100 \
                  -t 0.5 -c:a aac $brand_opt -y "$brand.m4a"
                uploaded=$(curl --fail --silent --show-error -X POST "$attempts_base" \
                  -F "file=@$brand.m4a;type=audio/mp4" -F "requestId=$m4a_id")
                printf '%s' "$uploaded" | python3 -c 'import json,sys; assert json.load(sys.stdin)["format"]=="m4a"'
                processed=false
                for check in $(seq 1 30); do
                  latest_m4a=$(curl --fail --silent --show-error "$attempts_base")
                  if printf '%s' "$latest_m4a" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a[0]["format"]=="m4a" and a[0]["status"]=="PROCESSED" and 0.4 <= a[0]["audioDurationSeconds"] <= 0.6'; then
                    processed=true; break
                  fi
                  sleep 1
                done
                test "$processed" = true
                echo "M4A brand $brand AAC upload: OK"
              done
              # A real MP4 video renamed to .m4a must never become PROCESSED.
              ffmpeg -nostdin -hide_banner -loglevel error \
                -f lavfi -i color=c=blue:s=32x32:r=5 \
                -f lavfi -i anullsrc=channel_layout=mono:sample_rate=44100 \
                -t 0.5 -c:v mpeg4 -c:a aac -y video.mp4
              cp video.mp4 video-renamed.m4a
              curl --fail --silent --show-error -X POST "$attempts_base" \
                -F "file=@video-renamed.m4a;type=audio/mp4" \
                -F "requestId=123e4567-e89b-12d3-a456-426614174008" -o /dev/null
              rejected_video=false
              for check in $(seq 1 30); do
                latest_video=$(curl --fail --silent --show-error "$attempts_base")
                if printf '%s' "$latest_video" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a[0]["status"]=="FAILED" and a[0]["processingErrorCode"]=="INVALID_MEDIA"'; then
                  rejected_video=true; break
                fi
                sleep 1
              done
              test "$rejected_video" = true
              printf 'not an ISO container' >broken.m4a
              bad_m4a_status=$(curl --silent --output invalid-m4a.json --write-out '%{http_code}' \
                -X POST "$attempts_base" -F "file=@broken.m4a;type=audio/mp4" \
                -F "requestId=123e4567-e89b-12d3-a456-426614174009")
              test "$bad_m4a_status" = '400'
              python3 -c 'import json; assert json.load(open("invalid-m4a.json"))["code"]=="INVALID_AUDIO_CONTENT"'
              echo "MP4 video disguise and fake M4A rejection: OK"
              # Regression P2: construct a playable AAC M4A with a 288-byte ftyp.
              # Preserve sample offsets after expanding the compatible-brand table.
              python3 - <<'PY'
          import struct
          data = bytearray(open("default.m4a", "rb").read())
          old = struct.unpack_from(">I", data, 0)[0]
          assert data[4:8] == b"ftyp" and old >= 16 and old <= 288 and (288 - old) % 4 == 0
          shift = 288 - old
          output = bytearray(struct.pack(">I", 288) + data[4:old] + b"isom" * (shift // 4) + data[old:])
          offset_boxes = 0
          cursor = 0
          while True:
              index = output.find(b"stco", cursor)
              if index < 0:
                  break
              count = struct.unpack_from(">I", output, index + 8)[0]
              for i in range(count):
                  pos = index + 12 + i * 4
                  struct.pack_into(">I", output, pos, struct.unpack_from(">I", output, pos)[0] + shift)
              offset_boxes += 1
              cursor = index + 4
          assert offset_boxes > 0, "Missing stco box in generated M4A"
          open("large-ftyp.m4a", "wb").write(output)
          PY
              ffprobe -v error -show_entries stream=codec_name \
                -of default=nw=1 large-ftyp.m4a | grep -q 'codec_name=aac'
              curl --fail --silent --show-error -X POST "$attempts_base" \
                -F "file=@large-ftyp.m4a;type=audio/mp4" \
                -F "requestId=123e4567-e89b-12d3-a456-426614174010" -o /dev/null
              long_ftyp_validated=false
              for check in $(seq 1 30); do
                result=$(curl --fail --silent --show-error "$attempts_base")
                if printf '%s' "$result" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a[0]["format"]=="m4a" and a[0]["status"]=="PROCESSED"'; then
                  long_ftyp_validated=true; break
                fi
                sleep 1
              done
              test "$long_ftyp_validated" = true
              echo "M4A with valid 288-byte ftyp: OK"
              # Regression P1: two valid AAC streams, first 1s and second 125s.
              # Whole recording exceeds the 120s limit despite the short first stream.
              ffmpeg -nostdin -hide_banner -loglevel error \
                -f lavfi -t 1 -i anullsrc=channel_layout=mono:sample_rate=16000 \
                -f lavfi -t 125 -i anullsrc=channel_layout=mono:sample_rate=16000 \
                -map 0:a:0 -map 1:a:0 -c:a aac -b:a 16k -y multi-track.m4a
              curl --fail --silent --show-error -X POST "$attempts_base" \
                -F "file=@multi-track.m4a;type=audio/mp4" \
                -F "requestId=123e4567-e89b-12d3-a456-426614174011" -o /dev/null
              multitrack_rejected=false
              for check in $(seq 1 30); do
                result=$(curl --fail --silent --show-error "$attempts_base")
                if printf '%s' "$result" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a[0]["format"]=="m4a" and a[0]["status"]=="FAILED" and a[0]["processingErrorCode"]=="DURATION_EXCEEDED"'; then
                  multitrack_rejected=true; break
                fi
                sleep 1
              done
              test "$multitrack_rejected" = true
              echo "Multi-AAC 1s + 125s correctly rejected: OK"
              all_formats=$(curl --fail --silent --show-error "$attempts_base")
              printf '%s' "$all_formats" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==10 and a[-1]["number"]==1 and a[-1]["status"]=="PROCESSED" and a[-2]["number"]==2 and a[-2]["processingErrorCode"]=="DURATION_EXCEEDED"'
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited early"
              tail -n 100 boot.log
              exit 1
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          tail -n 100 boot.log
          exit 1
