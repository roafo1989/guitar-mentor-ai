name: Java backend CI

on:
  push:
    branches:
      - main
      - "feature/dev-01-java-bootstrap"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/java-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guitar_mentor
          POSTGRES_USER: guitar_mentor_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guitar_mentor_app -d guitar_mentor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit tests and package
        run: ./mvnw --batch-mode verify
      - name: Launch app and verify PostgreSQL migration and HTTP
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/guitar_mentor
          SPRING_DATASOURCE_USERNAME: guitar_mentor_app
          SPRING_DATASOURCE_PASSWORD: ci_only_password
        run: |
          set -euo pipefail
          ./mvnw --batch-mode spring-boot:run > boot.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/system/ping | grep -q '"status":"ok"'; then
              curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'
              echo "Spring Boot and PostgreSQL Flyway bootstrap: OK"
              created=$(curl --fail --silent --show-error -X POST http://localhost:8080/api/v1/learners \
                -H 'Content-Type: application/json' \
                --data '{"displayName":"CI Student","instrumentCode":"ACOUSTIC_GUITAR","techniqueCode":"FINGERSTYLE","preferences":[{"styleCode":"FUNK","rating":"EXCLUDE"}]}')
              echo "$created" | grep -q '"rating":"EXCLUDE"'
              learner_id=$(printf '%s' "$created" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              curl --fail --silent --show-error "http://localhost:8080/api/v1/learners/$learner_id" | grep -q '"styleCode":"FUNK"'
              changed=$(curl --fail --silent --show-error -X PUT "http://localhost:8080/api/v1/learners/$learner_id/preferences" \
                -H 'Content-Type: application/json' \
                --data '{"instrumentCode":"ACOUSTIC_GUITAR","preferences":[{"styleCode":"BLUES","rating":"LIKE"}]}')
              echo "$changed" | grep -q '"styleCode":"BLUES"'
              if echo "$changed" | grep -q '"styleCode":"FUNK"'; then
                echo "Old preferences were not removed"
                exit 1
              fi
              echo "Learner profile REST smoke: OK"
              background=$(curl --fail --silent --show-error -X PUT \
                "http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/background" \
                -H 'Content-Type: application/json' \
                --data '{"experienceLevel":"BEGINNER","yearsPlaying":1,"skills":["CHORDS"],"knownPieces":[],"goals":["FINGERSTYLE"],"practiceMinutes":40,"sessionsPerWeek":3,"notes":""}')
              echo "$background" | grep -q '"experienceLevel":"BEGINNER"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/instruments/ACOUSTIC_GUITAR/background" \
                | grep -q '"sessionsPerWeek":3'
              echo "Onboarding REST smoke: OK"
              started=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions" \
                -H 'Content-Type: application/json' --data '{"instrumentCode":"ACOUSTIC_GUITAR"}')
              echo "$started" | grep -q '"status":"COLLECTING_EVIDENCE"'
              session_id=$(printf '%s' "$started" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              continued=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/continue")
              echo "$continued" | grep -q '"status":"READY_FOR_TASK"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id" \
                | grep -q '"status":"READY_FOR_TASK"'
              restarted=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions" \
                -H 'Content-Type: application/json' --data '{"instrumentCode":"ACOUSTIC_GUITAR"}')
              echo "$restarted" | grep -q "\"id\":\"$session_id\""
              echo "Diagnostic session HTTP smoke: OK"
              catalog=$(curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/exercises?instrumentCode=ACOUSTIC_GUITAR&techniqueCode=FINGERSTYLE")
              echo "$catalog" | grep -q '"code":"GM-EB01"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/exercises/GM-EB01/score" | grep -q 'score-partwise'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/exercises/GM-EB01/events" | grep -q '"measures"'
              assigned=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" \
                -H 'Content-Type: application/json' --data '{"exerciseCode":"GM-EB01"}')
              echo "$assigned" | grep -q '"code":"GM-EB01"'
              task_id=$(printf '%s' "$assigned" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
              repeat=$(curl --fail --silent --show-error -X POST \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" \
                -H 'Content-Type: application/json' --data '{"exerciseCode":"GM-EB01"}')
              echo "$repeat" | grep -q "\"id\":\"$task_id\""
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id" \
                | grep -q '"status":"TASK_ASSIGNED"'
              curl --fail --silent --show-error \
                "http://localhost:8080/api/v1/learners/$learner_id/diagnostic-sessions/$session_id/tasks" \
                | grep -q '"code":"GM-EB01"'
              echo "Exercise catalog and diagnostic assignment HTTP smoke: OK"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited early"
              tail -n 100 boot.log
              exit 1
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          tail -n 100 boot.log
          exit 1
