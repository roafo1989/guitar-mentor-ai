name: Conversion worker 170-E CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/conversion-worker/**'
      - 'scripts/research/catalog-169/**'
      - 'fixtures/research/catalog-169/**'
      - 'backend/src/**/LibraryConversion*.java'
      - 'backend/src/main/resources/application.yml'
      - 'frontend/src/**'
      - 'frontend/tests/conversion-live-browser.mjs'
      - 'frontend/package*.json'
      - '.github/workflows/conversion-worker-170b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-queue-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guitar_mentor
          POSTGRES_USER: guitar_mentor_app
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guitar_mentor_app -d guitar_mentor"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate independent musical and adversarial corpus
        run: |
          python -m pip install -r scripts/research/catalog-169/requirements.txt
          python scripts/conversion-worker/generate-corpus.py
      - name: Build pinned image
        run: docker build -f scripts/conversion-worker/Dockerfile -t gm-conversion-worker:170e .
      - name: Verify real cgroup, isolation, disk full, memory and timeout faults
        run: python scripts/conversion-worker/check-isolation.py
      - name: Verify all musical and adversarial cases in isolated containers
        run: python scripts/conversion-worker/check-corpus.py
      - name: Verify upload, durable queue, Java ProcessBuilder, persistence and owner download
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/guitar_mentor
          SPRING_DATASOURCE_USERNAME: guitar_mentor_app
          SPRING_DATASOURCE_PASSWORD: ci_only_password
          GUITAR_MENTOR_TEST_POSTGRES: 'true'
          GM_TEST_REAL_DOCKER: 'true'
          GM_TEST_CONVERSION_CORPUS: ${{ github.workspace }}/artifacts/conversion-170e/corpus
        run: ./mvnw -B -Dtest=LibraryConversionProcessRunnerTest,LibraryConversionJobPostgresTest,LibraryConversionOutputPostgresTest,LibraryConversionWorkerPostgresTest test
      - name: Verify full browser, authenticated HTTP, scheduler and Docker flow
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/guitar_mentor
          SPRING_DATASOURCE_USERNAME: guitar_mentor_app
          SPRING_DATASOURCE_PASSWORD: ci_only_password
          GUITAR_MENTOR_TEST_POSTGRES: 'true'
          GM_TEST_REAL_BROWSER: 'true'
          GM_TEST_CONVERSION_CORPUS: ${{ github.workspace }}/artifacts/conversion-170e/corpus
        run: ./mvnw -B -Dtest=LibraryConversionBrowserPostgresTest test
      - name: Upload evidence, including PDF and WAV for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-170e-evidence
          path: |
            artifacts/conversion-170e/*report.json
            artifacts/conversion-170e/corpus/manifest.json
            artifacts/conversion-170e/results/valid-*/
            artifacts/conversion-170e/browser/
            backend/target/surefire-reports/
          retention-days: 14
