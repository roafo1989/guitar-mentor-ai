name: Audio benchmark validator CI

on:
  pull_request:
    paths:
      - 'backend/src/main/java/ai/guitarmentor/research/**'
      - 'backend/src/test/java/ai/guitarmentor/research/**'
      - 'backend/pom.xml'
      - '.github/workflows/audio-benchmark-ci.yml'
  workflow_dispatch:

jobs:
  offline-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install audio inspection tools before tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Run actual positive and negative corpus tests
        run: mvn -B -ntp -f backend/pom.xml -Dtest=AudioCorpusValidatorTest,AudioCorpusReadinessTest -DfailIfNoTests=true test
      - name: Fail if positive audio test was skipped
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("backend/target/surefire-reports/TEST-ai.guitarmentor.research.AudioCorpusReadinessTest.xml")
          assert report.is_file(), "Missing audio readiness report"
          suite = ET.parse(report).getroot()
          assert int(suite.attrib["tests"]) >= 1
          assert int(suite.attrib["skipped"]) == 0, "Positive ffprobe scenario skipped"
          assert int(suite.attrib["failures"]) == 0 and int(suite.attrib["errors"]) == 0
          print("Audio corpus readiness test executed, no skips.")
          PY
