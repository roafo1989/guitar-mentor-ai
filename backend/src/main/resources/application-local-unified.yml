# Private Windows workstation only. Combine: secure,local-auth,local-unified.
# Short HTTPS alias stays the only application origin; Google OAuth callback
# still requires a separate allowed localhost URI until secure handoff exists.
# NEVER use this profile for public deployment, tunnels or other machines.
server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
guitar-mentor:
  security:
    enabled: true
    local-http: false
  local-auth:
    unified-local: true
    public-origin: https://guitar-mentor-dev

# Vite proxies to 127.0.0.1:8080 while the browser uses localhost:5173.
# Do not derive OAuth redirect_uri from the proxy Host header (127.0.0.1).
# Google requires an exact match with the registered Web OAuth redirect URI.
spring:
  security:
    oauth2:
      client:
        registration:
          guitar-mentor:
            redirect-uri: "http://localhost:5173/login/oauth2/code/{registrationId}"
