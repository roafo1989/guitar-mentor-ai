# Local password login without Google OIDC. Activate with SPRING_PROFILES_ACTIVE=local-auth.
# Requires a real SMTP host plus externally configured HTTPS public origin for verification.
guitar-mentor:
  security:
    enabled: true
  local-auth:
    public-origin: ${GUITAR_MENTOR_PUBLIC_ORIGIN:}
    mail-from: ${GUITAR_MENTOR_MAIL_FROM:}
spring:
  mail:
    host: ${GUITAR_MENTOR_SMTP_HOST:}
    port: ${GUITAR_MENTOR_SMTP_PORT:587}
    username: ${GUITAR_MENTOR_SMTP_USER:}
    password: ${GUITAR_MENTOR_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${GUITAR_MENTOR_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${GUITAR_MENTOR_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${GUITAR_MENTOR_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
