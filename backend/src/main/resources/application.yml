spring:
  application:
    name: guitar-mentor-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guitar_mentor}
    username: ${SPRING_DATASOURCE_USERNAME:guitar_mentor_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 32MB

# Still a single-user local prototype. An ID in a URL is not authentication.
server:
  address: ${GUITAR_MENTOR_BIND_ADDRESS:127.0.0.1}

guitar-mentor:
  submissions:
    # Explicit opt-in for local, non-personal test recordings only.
    enabled: ${GUITAR_MENTOR_ENABLE_UPLOADS:false}
    storage-path: ${GUITAR_MENTOR_MEDIA_PATH:./.local-media/attempts}
    score-storage-path: ${GUITAR_MENTOR_SCORE_PATH:./.local-media/scores}
    poll-delay-ms: ${GUITAR_MENTOR_PROCESS_POLL_MS:3000}
    ffprobe-command: ${GUITAR_MENTOR_FFPROBE:ffprobe}

# #18: explicitly opt in only after applying Flyway V16 on a local QA database.
# Disabling the API must not remove the terminal guard from existing uploads.
guitarmentor:
  learning:
    enabled: ${GUITAR_MENTOR_ENABLE_LEARNING:false}
    # Empty until #22 approves a real measurement method and version.
    validated-methods: ${GUITAR_MENTOR_VALIDATED_METHODS:}
    # Internal writer: empty credentials mean all HUMAN_REVIEW and measurement writes are denied.
    # Supply only via local secured deployment environment, never via HTTP or source control.
    review-principal: ${GUITAR_MENTOR_REVIEW_PRINCIPAL:}
    review-token: ${GUITAR_MENTOR_REVIEW_TOKEN:}
    measurement-principal: ${GUITAR_MENTOR_MEASUREMENT_PRINCIPAL:}
    measurement-token: ${GUITAR_MENTOR_MEASUREMENT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
