spring:
  application:
    name: guitar-mentor-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guitar_mentor}
    username: ${SPRING_DATASOURCE_USERNAME:guitar_mentor_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# DEV-02 endpoints have no authentication. Bind to loopback until security is implemented.
server:
  address: ${GUITAR_MENTOR_BIND_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
